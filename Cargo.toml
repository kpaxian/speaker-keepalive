[package]
name = "speaker-keepalive"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
publish = false
description = "An experimental Bluetooth speaker keepalive for PipeWire"

[dependencies]
clap = { version = "=4.5.20", default-features = false, features = ["derive", "std", "help", "usage", "error-context", "suggestions"] }
ctrlc = "=3.4.5"
nix = { version = "=0.29.0", default-features = false, features = ["fs", "poll", "signal", "process"] }
